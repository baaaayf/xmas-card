<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>聖誕卡片加密機 (分開加密版) 🔒</title>
    <style>
        body { font-family: "Helvetica", sans-serif; padding: 50px; background: #f0f0f0; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 30px; border-radius: 10px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        input, textarea { width: 100%; margin-bottom: 20px; padding: 10px; box-sizing: border-box; font-size: 16px; border: 1px solid #ccc; border-radius: 5px; }
        button { background: #d13030; color: white; border: none; padding: 10px 20px; font-size: 18px; cursor: pointer; border-radius: 5px; width: 100%; }
        button:hover { background: #b01e1e; }
        .result-area { margin-top: 20px; background: #2d2d2d; color: #50fa7b; padding: 20px; border-radius: 5px; font-family: 'Consolas', monospace; display: none; white-space: pre-wrap; line-height: 1.5;}
        h3 { margin-top: 0; border-bottom: 1px solid #eee; padding-bottom: 10px;}
        small { color: #666; display: block; margin-bottom: 5px; font-weight: bold;}
    </style>
</head>
<body>
    <div class="container">
        <h2>🔒 卡片內容加密機 (JSON格式)</h2>
        
        <small>1. 設定朋友的暱稱 (也是密碼)</small>
        <input type="text" id="pass" placeholder="例如: scott">
        
        <small>2. 朋友的地址 (可留空)</small>
        <textarea id="addr" rows="3" placeholder="100 台北市信義區..."></textarea>

        <small>3. 想對他說的話</small>
        <textarea id="msg" rows="6" placeholder="聖誕快樂！新的一年加油！"></textarea>
        
        <button onclick="doEncrypt()">產生 JSON 代碼</button>

        <div id="result-box" class="result-area">
            <div>請複製下方內容到 data.json 的大括號中：</div>
            <br>
            <div id="output"></div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <script>
        function doEncrypt() {
            var p = document.getElementById('pass').value.trim().toLowerCase(); 
            var a = document.getElementById('addr').value;
            var m = document.getElementById('msg').value;
            
            if(!p || !m) { alert("暱稱和內容一定要填喔！"); return; }
            
            // --- 1. 分開加密 ---
            // 加密訊息
            var encryptedMsg = CryptoJS.AES.encrypt(m, p).toString();
            
            // 加密地址 (如果有填寫的話，沒填寫就留空字串)
            var encryptedAddr = "";
            if(a && a.trim() !== "") {
                encryptedAddr = CryptoJS.AES.encrypt(a, p).toString();
            }

            // --- 2. 組合成 JSON 字串 ---
            // 這裡我們直接幫你排版成 key: { msg: "...", addr: "..." } 的格式
            var jsonKey = `  "${p}": {\n`;
            var jsonMsg = `    "msg": "${encryptedMsg}",\n`;
            var jsonAddr = `    "addr": "${encryptedAddr}"\n`;
            var jsonEnd = `  },`; // 結尾加個逗號方便你連續貼上

            var finalString = jsonKey + jsonMsg + jsonAddr + jsonEnd;
            
            document.getElementById('result-box').style.display = 'block';
            document.getElementById('output').innerText = finalString;
        }
    </script>
</body>
</html>
